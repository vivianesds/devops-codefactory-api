name: CI Pipeline

on:
  push:
    branches:
      - main
      - desenvolvimento
  pull_request:
    branches:
      - main
      - desenvolvimento

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Testes Automatizados com Pytest
        env:
          PYTHONPATH: .
        run: |
          python -m pytest

      - name: Build da Imagem Docker
        run: |
          docker build -t devops-codefactory-api .